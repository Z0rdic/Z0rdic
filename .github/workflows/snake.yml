# Draws the contribution "snake" for the profile README.
# Runs every day, on each push to main, and on demand (Actions tab -> Run workflow).
# The SVGs are published to the `output` branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-grid.svg?color_snake=#7C3AED
            dist/snake-grid-dark.svg?palette=github-dark&color_snake=#A78BFA

      # The generator draws a margin around the grid and starts/ends the snake
      # one row above it. Hide every snake piece while it is off the grid, then
      # crop each SVG to the grid plus its progress bar, so the snake is only
      # ever visible on the squares.
      - name: Keep the snake on the grid
        run: |
          python3 - <<'PY'
          import glob, re

          def hide_off_grid(block):
              # Each snake piece is visible only while it sits on the grid.
              # Opacity switches instantly: off as soon as it starts leaving,
              # on only once it has fully arrived on a square.
              name = re.match(r'@keyframes (s\d+)\{', block).group(1)
              frames = re.findall(r'([\d.%,]+)\{transform:translate\((-?[\d.]+)px,(-?[\d.]+)px\)\}', block)
              points = sorted((float(p.rstrip('%')), float(x) < 0 or float(y) < 0)
                              for pcts, x, y in frames for p in pcts.split(','))
              if not any(hidden for _, hidden in points):
                  return block
              stops = {}
              for i, (pct, hidden) in enumerate(points):
                  stops[pct] = 0 if hidden else 1
                  nxt = points[i + 1] if i + 1 < len(points) else None
                  if nxt and hidden and not nxt[1]:      # entering: stay hidden until arrival
                      stops[round(nxt[0] - 0.01, 3)] = 0
                  if nxt and not hidden and nxt[1]:      # leaving: hide right away
                      stops[round(pct + 0.01, 3)] = 0
              stops.setdefault(100.0, stops[min(stops)])
              body = block[len(f'@keyframes {name}{{'):-1]
              body += "".join(f"{p:g}%{{opacity:{o}}}" for p, o in sorted(stops.items()))
              return f"@keyframes {name}{{{body}}}"

          for path in glob.glob("dist/*.svg"):
              svg = open(path, encoding="utf-8").read()
              svg = re.sub(r'@keyframes s\d+\{(?:[^{}]*\{[^}]*\})*\}',
                           lambda m: hide_off_grid(m.group(0)), svg)
              cells = re.findall(r'<rect class="c[^"]*" x="([\d.]+)" y="([\d.]+)"', svg)
              size = re.search(r'\.c\{[^}]*width:\s*([\d.]+)px', svg)
              cell = float(size.group(1)) if size else 12.0
              right = max(float(x) for x, _ in cells) + cell + 2
              bottom = max(float(y) for _, y in cells) + cell + 2
              bar = re.search(r'<rect class="u[^"]*" height="([\d.]+)" width="([\d.]+)" x="[\d.]+" y="([\d.]+)"', svg)
              if bar:
                  right = max(right, float(bar.group(2)))
                  bottom = float(bar.group(3)) + float(bar.group(1))
              w, h = round(right, 1), round(bottom, 1)
              svg = re.sub(r'viewBox="[^"]*" width="[\d.]+" height="[\d.]+"',
                           f'viewBox="0 0 {w} {h}" width="{w}" height="{h}"', svg, count=1)
              open(path, "w", encoding="utf-8").write(svg)
              print(path, "->", w, "x", h)
          PY

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
