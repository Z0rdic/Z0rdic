# Draws the contribution "snake" for the profile README.
# Runs every day, on each push to main, and on demand (Actions tab -> Run workflow).
# The SVGs are published to the `output` branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-grid.svg?color_snake=#7C3AED
            dist/snake-grid-dark.svg?palette=github-dark&color_snake=#A78BFA

      # The generator draws a margin around the grid and starts/ends the snake
      # one row above it. Instead, the whole snake fades in already on the
      # first squares, eats the grid, then holds still and fades out where it
      # finished. Each SVG is then cropped to the grid plus its progress bar.
      - name: Keep the snake on the grid
        run: |
          python3 - <<'PY'
          import glob, re

          KF = re.compile(r'@keyframes (s\d+)\{((?:[^{}]*\{[^}]*\})*)\}')
          FRAME = re.compile(r'([\d.%,]+)\{transform:translate\((-?[\d.]+)px,(-?[\d.]+)px\)\}')

          def path_of(body):
              pts = sorted((float(p.rstrip('%')), float(x), float(y))
                           for pcts, x, y in FRAME.findall(body) for p in pcts.split(','))
              return pts

          def on_grid(x, y):
              return x >= 0 and y >= 0

          def pos(pts, t):
              # CSS linear interpolation between keyframes.
              prev = pts[0]
              for p in pts:
                  if p[0] >= t:
                      if p[0] == prev[0]:
                          return p[1], p[2]
                      k = (t - prev[0]) / (p[0] - prev[0])
                      return prev[1] + (p[1] - prev[1]) * k, prev[2] + (p[2] - prev[2]) * k
                  prev = p
              return pts[-1][1], pts[-1][2]

          def fade_on_grid(svg):
              paths = {m.group(1): path_of(m.group(2)) for m in KF.finditer(svg)}
              if not paths:
                  return svg
              # When every piece is on the grid (start) and before any leaves (end).
              start = max(next(p for p, x, y in pts if on_grid(x, y)) for pts in paths.values())
              end = min(max(p for p, x, y in pts if on_grid(x, y) and p > start
                            and all(on_grid(x2, y2) for p2, x2, y2 in pts if start <= p2 <= p))
                        for pts in paths.values())

              def rebuild(m):
                  name, pts = m.group(1), paths[m.group(1)]
                  sx, sy = pos(pts, start)
                  ex, ey = pos(pts, end)
                  frames = [(0, sx, sy, 0), (start, sx, sy, 1)]
                  frames += [(p, x, y, 1) for p, x, y in pts if start < p < end]
                  frames += [(end, ex, ey, 1), (100, ex, ey, 0)]
                  body = "".join(f"{p:g}%{{transform:translate({x:g}px,{y:g}px);opacity:{o}}}"
                                 for p, x, y, o in frames)
                  return f"@keyframes {name}{{{body}}}"

              return KF.sub(rebuild, svg)

          for path in glob.glob("dist/*.svg"):
              svg = open(path, encoding="utf-8").read()
              svg = fade_on_grid(svg)
              cells = re.findall(r'<rect class="c[^"]*" x="([\d.]+)" y="([\d.]+)"', svg)
              size = re.search(r'\.c\{[^}]*width:\s*([\d.]+)px', svg)
              cell = float(size.group(1)) if size else 12.0
              right = max(float(x) for x, _ in cells) + cell + 2
              bottom = max(float(y) for _, y in cells) + cell + 2
              bar = re.search(r'<rect class="u[^"]*" height="([\d.]+)" width="([\d.]+)" x="[\d.]+" y="([\d.]+)"', svg)
              if bar:
                  right = max(right, float(bar.group(2)))
                  bottom = float(bar.group(3)) + float(bar.group(1))
              w, h = round(right, 1), round(bottom, 1)
              svg = re.sub(r'viewBox="[^"]*" width="[\d.]+" height="[\d.]+"',
                           f'viewBox="0 0 {w} {h}" width="{w}" height="{h}"', svg, count=1)
              open(path, "w", encoding="utf-8").write(svg)
              print(path, "->", w, "x", h)
          PY

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
